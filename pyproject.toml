[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmfixture"
dynamic = ["version"]
description = "Catches deprecated model IDs, broken structured-output schemas, and fragile MCP tools before they reach production."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "LLM Fixture contributors" }]
keywords = ["llm", "ci", "scanner", "mcp", "structured-output"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/iliagerash/lfix"
Repository = "https://github.com/iliagerash/lfix"
Issues = "https://github.com/iliagerash/lfix/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
lfix = "llmfixture.cli:app"

[tool.hatch.version]
path = "src/llmfixture/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmfixture"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
